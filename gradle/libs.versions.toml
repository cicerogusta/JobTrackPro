[versions]
agp = "9.5.0"
kotlin = "2.4.0"
ksp = "2.3.13"
hilt = "2.60.1"
compose = "2026.02.01"
lifecycle = "2.11.0"
coroutines = "1.11.0"
room = "2.8.5"
firebase = "35.1.0"

[libraries]
core = { module = "androidx.core:core-ktx", version = "1.19.1" }
activity = { module = "androidx.activity:activity-compose", version = "1.13.0" }
appcompat = { module = "androidx.appcompat:appcompat", version = "1.8.0" }
fragment = { module = "androidx.fragment:fragment-compose", version = "1.8.9" }
fragment-ktx = { module = "androidx.fragment:fragment-ktx", version = "1.8.9" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version = "1.4.0" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.2.1" }
material = { module = "com.google.android.material:material", version = "1.14.0" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material = { module = "androidx.compose.material3:material3" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigation = { module = "androidx.navigation:navigation-compose", version = "2.10.2" }
hilt-navigation = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version = "1.3.0" }
hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-tasks = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
room = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-test = { module = "androidx.room:room-testing", version.ref = "room" }
datastore = { module = "androidx.datastore:datastore-preferences", version = "1.3.0" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version = "3.0.0" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version = "3.0.0" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version = "4.12.0" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
junit = { module = "junit:junit", version = "4.13.2" }
mockk = { module = "io.mockk:mockk", version = "1.14.6" }
android-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
espresso = { module = "androidx.test.espresso:espresso-core", version = "3.7.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version = "4.5.0" }
